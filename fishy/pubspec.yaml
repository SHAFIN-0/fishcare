name: fishcare_app
description: FishCare — AI-powered fish disease detection app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  http: ^1.2.2
  intl: ^0.19.0
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  shared_preferences: ^2.3.2
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fish_disease_model.tflite
    - assets/labels.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  remove_alpha_ios: true
